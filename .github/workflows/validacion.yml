name: Validar y generar tablero
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/control_lavanderia.py
      - uses: actions/upload-artifact@v4
        with:
          name: tablero-lavanderia
          path: docs/
